      <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
    </g>
  </g>

  <!-- Doctor Name under QR -->
  <text class="google-font doctor-name" x="160" y="338" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="-0.2">Dr Roopali Garg Mangla</text>
  <text class="google-font" x="160" y="358" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="500">Homeopathic Clinic • Greater Noida</text>
</svg>