<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .google-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-weight: 700; fill: #1f2937; }
    .doctor-name { font-weight: 700; fill: #111827; }
  </style>

  <!-- Background -->
  <rect width="320" height="380" rx="24" fill="#ffffff" />

  <!-- Google Wordmark -->
  <g transform="translate(160, 36)">
    <g transform="scale(1.15) translate(-36, -10)">
      <text class="google-font" font-size="22" font-weight="600" letter-spacing="-0.5">
        <tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan>
      </text>
    </g>
  </g>

  <!-- Title: Check us out on Google -->
  <text class="google-font heading" x="160" y="68" text-anchor="middle" font-size="18" letter-spacing="-0.2">Check us out on Google</text>

  <!-- QR Frame (220x220) with Google 4-color borders -->
  <g transform="translate(50, 88)" filter="url(#cardShadow)">
    <!-- Outer rounded border base -->
    <rect x="0" y="0" width="220" height="220" rx="26" fill="none" stroke="#4285F4" stroke-width="8" />
    <!-- Segment overlays for Google Brand Colors -->
    <path d="M 110 0 L 194 0 A 26 26 0 0 1 220 26 L 220 110" fill="none" stroke="#EA4335" stroke-width="8" stroke-linecap="round" />
    <path d="M 220 110 L 220 194 A 26 26 0 0 1 194 220 L 110 220" fill="none" stroke="#FBBC05" stroke-width="8" stroke-linecap="round" />
    <path d="M 110 220 L 26 220 A 26 26 0 0 1 0 194 L 0 110" fill="none" stroke="#34A853" stroke-width="8" stroke-linecap="round" />
    <path d="M 0 110 L 0 26 A 26 26 0 0 1 26 0 L 110 0" fill="none" stroke="#4285F4" stroke-width="8" stroke-linecap="round" />

    <!-- White QR Canvas -->
    <rect x="8" y="8" width="204" height="204" rx="18" fill="#ffffff" />

