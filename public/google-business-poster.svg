<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Page Background -->
  <rect width="600" height="850" fill="#ffffff" />

  <!-- Google Business Profile Header -->
  <g transform="translate(300, 60)">
    <g transform="scale(1.2) translate(-90, -10)">
      <text class="font-sans" font-size="18" font-weight="500">
        <tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan>
        <tspan fill="#5f6368" font-weight="400"> Business Profile</tspan>
      </text>
    </g>
  </g>

  <!-- Title: Here is your Google QR! -->
  <text class="font-sans" x="300" y="116" text-anchor="middle" font-size="32" font-weight="700" fill="#111827" letter-spacing="-0.5">Here is your Google QR!</text>

  <!-- Cut Line with Scissors -->
  <g transform="translate(60, 240)">
    <line x1="0" y1="0" x2="480" y2="0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,6" />
    <g transform="translate(80, -14)">
